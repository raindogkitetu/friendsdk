# Modified in this fork: Signal Garden adds integrity, audit, simulation and browser checks.
name: SDK and game checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: sdk-game-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify official FriendSDK v0.1.4 runtime integrity
        run: |
          git fetch --no-tags --depth=1 https://github.com/spokesz/friendsdk.git ca3bf183b809ecf22d87c63d88ce03969a3f8da2
          git diff --exit-code ca3bf183b809ecf22d87c63d88ce03969a3f8da2 -- \
            src contracts assets LICENSE NOTICE.md package.json package-lock.json \
            scripts/dev-game.mjs scripts/testing.mjs scripts/browser-fixture.mjs
      - run: npm ci --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: npm run build:contracts
      - run: npm run verify:contracts
      - run: npm run test:contracts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:games
      - run: node games/signal-garden/audit.mjs
      - run: node games/signal-garden/simulate.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - run: node games/signal-garden/check.mjs
