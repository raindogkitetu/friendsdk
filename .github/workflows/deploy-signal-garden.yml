name: Deploy Signal Garden preview

on:
  push:
    branches:
      - main
    paths:
      - "games/signal-garden/**"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-signal-garden.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-garden-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx friendsdk check games/signal-garden
      - run: node games/signal-garden/audit.mjs
      - run: node games/signal-garden/simulate.mjs
      - run: npx playwright install --with-deps chromium
      - run: node games/signal-garden/check.mjs

      - name: Upload audited screenshots
        uses: actions/upload-artifact@v4
        with:
          name: signal-garden-audit
          path: games/signal-garden/media/signal-garden-*.png
          if-no-files-found: error
          retention-days: 7

      - run: node scripts/dev-game.mjs build games/signal-garden

      - name: Copy tested artifacts and provenance into preview
        run: |
          cp games/signal-garden/media/signal-garden-960.png games/signal-garden/.friendsdk/signal-garden-960.png
          cp games/signal-garden/media/signal-garden-360.png games/signal-garden/.friendsdk/signal-garden-360.png
          printf '%s\n' "$GITHUB_SHA" > games/signal-garden/.friendsdk/SOURCE_COMMIT.txt

      - name: Verify static preview
        run: |
          test -f games/signal-garden/.friendsdk/index.html
          test -f games/signal-garden/.friendsdk/game.html
          test -f games/signal-garden/.friendsdk/game.js
          test -f games/signal-garden/.friendsdk/game.css
          test -f games/signal-garden/.friendsdk/signal-garden-960.png
          test -f games/signal-garden/.friendsdk/signal-garden-360.png
          test "$(cat games/signal-garden/.friendsdk/SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          cat > /tmp/signal-garden-expected-files.txt <<'EOF'
          .friendsdk-output.json
          SOURCE_COMMIT.txt
          game-layout.css
          game.css
          game.html
          game.js
          index.html
          layout.css
          runtime.css
          runtime.js
          signal-garden-360.png
          signal-garden-960.png
          EOF
          find games/signal-garden/.friendsdk -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/signal-garden-actual-files.txt
          diff -u /tmp/signal-garden-expected-files.txt /tmp/signal-garden-actual-files.txt
          test -z "$(find games/signal-garden/.friendsdk -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          ! grep -Eq '__friendWalletTest|Fixture interrupted|0x1111111111111111111111111111111111111111' games/signal-garden/.friendsdk/game.js
          ! grep -Eq '__friendWalletTest|Fixture interrupted|0x1111111111111111111111111111111111111111' games/signal-garden/.friendsdk/runtime.js
          grep -q 'rpc.mainnet.chain.robinhood.com' games/signal-garden/.friendsdk/runtime.js

      - name: Publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd games/signal-garden/.friendsdk
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Signal Garden preview from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
